services:
  - type: web
    name: kp-whatsapp-automation-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
